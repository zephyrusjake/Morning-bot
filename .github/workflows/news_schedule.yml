name: Semiconductor News Bot

on:
  schedule:
    # 1. 오전 07:30 KST (UTC 22:30)
    - cron: '30 22 * * *'
    # 2. 오전 12:00(정오) KST (UTC 03:00)
    - cron: '0 3 * * *'
    # 3. 오후 02:30 KST (UTC 05:30)
    - cron: '30 5 * * *'
    # 4. 오후 05:00 KST (UTC 08:00)
    - cron: '0 8 * * *'
  workflow_dispatch: # 수동 테스트 버튼 활성화

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-telegram-bot deep-translator

      - name: Run news bot
        run: python news_bot.py
