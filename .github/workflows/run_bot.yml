name: Morning Bot

on:
  schedule:
    # UTC 기준 시간으로 설정해야 하므로 한국 시간(KST)보다 9시간 느리게 설정됩니다.
    # 오전 8시 (KST) = 전날 23:00 또는 당일 23:00? (UTC 23:00 = KST 오전 8시)
    # 5개 시간대 설정 (오전 8시, 11시 / 오후 3시, 8시, 10시 KST 기준)
    - cron: '0 23,2,6,11,13 * * *'  # UTC 기준 (밤 11시, 새벽 2시, 아침 6시, 낮 11시, 오후 1시)
  workflow_dispatch:  # 수동 실행(Run workflow) 버튼 유지

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot yfinance requests beautifulsoup4

    - name: Run bot
      run: |
        python bot.py
