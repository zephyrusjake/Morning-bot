name: Morning Bot

on:
  schedule:
    # 한국 시간 아침 7시 30분에 실행되도록 설정한 시간 (UTC 기준 밤 22시 30분)
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests yfinance python-telegram-bot

      - name: Run script
        run: python bot.py
